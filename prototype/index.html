<title>Slovíčka — prototyp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap');

:root{
  --font:"Figtree",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --stage:#DCE1E9; --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F4F6F9; --surface-3:#E9EDF2;
  --ink:#10151C; --ink-2:#444D5C; --ink-3:#687282; --line:#DEE3EA; --line-2:#C9D0DA;
  --accent:#2A55D6; --accent-ink:#FFFFFF; --accent-soft:#E4EBFC; --accent-line:#B9C9F3;
  --ok:#17744A; --ok-soft:#DFF2E7; --ok-line:#9FD2B6;
  --near:#85560A; --near-soft:#FAEED1; --near-line:#E5C57F;
  --again:#5B41C2; --again-soft:#EAE6F9; --again-line:#BDB1EA;
  --danger:#BE3129; --danger-soft:#FBE8E6;
  --scrim:rgba(14,18,26,.42); --bezel:#171B22;
  --shadow:0 1px 2px rgba(16,21,28,.05),0 8px 24px rgba(16,21,28,.06);
  --paper:#F3F4F0; --paper-ink:#27303D; --paper-line:#BFD0E6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#07090D; --bg:#0D1117; --surface:#161B23; --surface-2:#1C222C; --surface-3:#242B37;
    --ink:#EDF0F5; --ink-2:#B2BBC9; --ink-3:#8791A2; --line:#262D38; --line-2:#364050;
    --accent:#86A3FF; --accent-ink:#0A1124; --accent-soft:#1B2850; --accent-line:#34498A;
    --ok:#5ED19A; --ok-soft:#133126; --ok-line:#276B4C;
    --near:#F0BA5B; --near-soft:#35290F; --near-line:#7A5C1E;
    --again:#B1A4FF; --again-soft:#262050; --again-line:#4C4392;
    --danger:#FF9088; --danger-soft:#3A1C1A;
    --scrim:rgba(0,0,0,.6); --bezel:#2A303A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --paper:#D9DBD4; --paper-ink:#232B38; --paper-line:#9FB2CC;
  }
}
:root[data-theme="dark"]{
  --stage:#07090D; --bg:#0D1117; --surface:#161B23; --surface-2:#1C222C; --surface-3:#242B37;
  --ink:#EDF0F5; --ink-2:#B2BBC9; --ink-3:#8791A2; --line:#262D38; --line-2:#364050;
  --accent:#86A3FF; --accent-ink:#0A1124; --accent-soft:#1B2850; --accent-line:#34498A;
  --ok:#5ED19A; --ok-soft:#133126; --ok-line:#276B4C;
  --near:#F0BA5B; --near-soft:#35290F; --near-line:#7A5C1E;
  --again:#B1A4FF; --again-soft:#262050; --again-line:#4C4392;
  --danger:#FF9088; --danger-soft:#3A1C1A;
  --scrim:rgba(0,0,0,.6); --bezel:#2A303A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --paper:#D9DBD4; --paper-ink:#232B38; --paper-line:#9FB2CC;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--stage);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
u.d{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:800}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
.ic{width:22px;height:22px;flex:none;display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- stage + device ---------- */
.stage{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.pv{display:none}
@media (hover:hover) and (pointer:fine) and (min-width:900px){
  .pv{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px 16px;font-size:13px;color:var(--ink-2)}
  .pv .lbl{font-weight:600;color:var(--ink-3);letter-spacing:.02em}
  .fw{padding:6px 16px 36px}
}
.fw{flex:1;display:flex;justify-content:center;align-items:flex-start}
.seg{display:inline-flex;background:var(--surface-3);border-radius:11px;padding:3px;gap:2px}
.seg button{min-height:34px;padding:0 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,21,28,.14)}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1;min-height:40px}

.device{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--g:16px;transform-origin:0 0}
.device.framed{border-radius:46px;box-shadow:0 0 0 11px var(--bezel),0 30px 70px rgba(0,0,0,.28);--sat:14px;--sab:16px}
.device.wide{--g:28px}
.gut{padding-left:max(var(--g),env(safe-area-inset-left,0px));padding-right:max(var(--g),env(safe-area-inset-right,0px))}

.protobar{flex:none;display:flex;align-items:center;justify-content:space-between;padding-top:calc(var(--sat) + 6px);padding-bottom:6px;min-height:34px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.01em;color:var(--ink-3);background:var(--surface-3);border-radius:999px;padding:3px 10px 3px 8px;line-height:1.3}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--near);display:block}

.area{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.shell{flex:1;min-height:0;display:flex}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:28px;-webkit-overflow-scrolling:touch}
.content>.wrap{max-width:720px;margin:0 auto}
.device.wide .content>.wrap{padding-top:8px}

.side{display:none}
.tabbar{flex:none;display:flex;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(var(--sab) + 2px) max(4px,env(safe-area-inset-left,0px))}
.tabbar .tab{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);border-radius:12px}
.tabbar .tab.on{color:var(--accent)}
.tabbar .tab .ic{width:24px;height:24px}
.device.wide .tabbar{display:none}
.device.wide .side{display:flex;flex-direction:column;flex:none;width:224px;padding:12px 12px 20px;border-right:1px solid var(--line);background:var(--surface)}
.device.wide.land .side{width:244px}
.brand{display:flex;align-items:center;gap:10px;padding:10px 12px 18px;font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand svg{width:28px;height:28px}
.side .tab{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;font-weight:600;font-size:16px;color:var(--ink-2);width:100%}
.side .tab.on{background:var(--accent-soft);color:var(--accent)}
.side .tab span{flex:1}

/* ---------- typography ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:14px}
.ph h1{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
.device.wide .ph h1{font-size:38px}
.ph .actions{display:flex;gap:8px}
.sub{color:var(--ink-2);font-size:15px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
h2.sec{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 8px}
.muted{color:var(--ink-3)}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:16px;font-weight:700;font-size:17px;width:100%;text-align:center;transition:transform .08s ease,background-color .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-2)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);min-height:48px}
.btn.danger{background:var(--danger);color:#fff}
.btn.dangerline{background:var(--surface);color:var(--danger);border:1.5px solid var(--danger)}
.btn.sm{min-height:44px;font-size:15px;border-radius:13px;padding:0 16px;width:auto}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);background:var(--surface);border:1px solid var(--line)}
.iconbtn.plain{background:transparent;border-color:transparent}
.link{color:var(--accent);font-weight:600;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.stack{display:flex;flex-direction:column;gap:10px}
.rowbtns{display:flex;gap:10px}
.rowbtns .btn{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 16px;width:100%}
.lrow .lt{flex:1;min-width:0}
.lrow .lt b{display:block;font-weight:650}
.lrow .lt small{display:block;color:var(--ink-3);font-size:14px}
.lrow .chev{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;border-radius:999px;padding:3px 10px;background:var(--surface-3);color:var(--ink-2);line-height:1.4}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.near{background:var(--near-soft);color:var(--near)}
.pill.again{background:var(--again-soft);color:var(--again)}
.pill .ic{width:14px;height:14px}
.empty{text-align:left;padding:28px 0 0;display:flex;flex-direction:column;gap:12px}
.empty h2{font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
.empty p{color:var(--ink-2)}
.note{background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.note .ic{color:var(--accent);margin-top:1px;width:20px;height:20px}
.note.warn{background:var(--near-soft)}
.note.warn .ic{color:var(--near)}

/* ---------- practice home ---------- */
.round{display:flex;flex-direction:column;gap:16px}
.round .big{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.035em}
.round .big small{font-size:22px;font-weight:700;letter-spacing:-.01em;color:var(--ink-2);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.chip .ic{width:18px;height:18px;color:var(--accent)}
.pickrow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.pickrow .t{flex:1;min-width:0}
.pickrow .t small{display:block;color:var(--ink-3);font-size:13px;font-weight:600}
.pickrow .t b{font-weight:650;font-size:15.5px}
.hero{max-width:560px;margin:0 auto}

/* ---------- sets ---------- */
.split{display:grid;grid-template-columns:minmax(210px,250px) 1fr;gap:20px;align-items:start}
.device.land .split{grid-template-columns:minmax(260px,320px) 1fr;gap:24px}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 14px;border-radius:16px}
.srow.on{background:var(--accent-soft)}
.srow .t{flex:1;min-width:0}
.srow .t b{display:block;font-weight:700;font-size:16.5px}
.srow .t small{display:block;color:var(--ink-3);font-size:14px;margin-top:1px}
.lang{display:inline-block;font-weight:800;font-size:11px;letter-spacing:.06em;background:var(--surface-3);border-radius:6px;padding:1px 6px;color:var(--ink-2)}
.inpr{color:var(--accent);font-weight:650}
.wrow{display:flex;align-items:center;gap:8px;width:100%;min-height:62px;padding:8px 8px 8px 16px}
.wrow .t{flex:1;min-width:0}
.wrow .t b{display:block;font-weight:700;font-size:17px}
.wrow .t span{display:block;color:var(--ink-2);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fresh{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.dh{padding:4px 0 12px}
.dh h2{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:650;min-height:44px;margin-left:-8px;padding-right:12px}

/* ---------- speaker ---------- */
.spk{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);flex:none;position:relative}
.spk:hover{background:var(--accent-soft)}
.spk .ic{width:22px;height:22px}
.spk .w1,.spk .w2{opacity:.9}
.spk.playing{background:var(--accent-soft)}
.spk.playing .w1{animation:wave 0.9s ease-in-out infinite}
.spk.playing .w2{animation:wave 0.9s ease-in-out .25s infinite}
@keyframes wave{0%,100%{opacity:.15}50%{opacity:1}}
.spk.lg{width:52px;height:52px;background:var(--accent-soft)}

/* ---------- segmented/choice controls ---------- */
.check{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;color:transparent;flex:none;background:var(--surface)}
.check.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.box .ic{width:16px;height:16px;stroke-width:3}
.radio .box{border-radius:50%}
.radio.on .box{background:var(--surface);border-color:var(--accent);color:var(--accent)}
.radio.on .box::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent);display:block}
.radio .box .ic{display:none}
.check .tx{flex:1;min-width:0;font-weight:600}
.check .tx small{display:block;font-weight:500;color:var(--ink-3);font-size:14px}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-height:92%;background:var(--surface);border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.device.wide .scrim{align-items:center;padding:24px}
.device.wide .sheet{max-width:540px;border-radius:26px;max-height:88%}
.sheet-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;padding-bottom:10px;min-height:56px}
.sheet-h h2{font-size:19px;font-weight:800;letter-spacing:-.01em;flex:1;text-align:center}
.sheet-h .sl,.sheet-h .sr{min-width:72px;display:flex}
.sheet-h .sr{justify-content:flex-end}
.sheet-h .tbtn{color:var(--accent);font-weight:650;min-height:44px;padding:0 4px;display:inline-flex;align-items:center}
.sheet-h .tbtn[disabled]{opacity:.4}
.sheet-b{flex:1;min-height:0;overflow-y:auto;padding-top:4px;padding-bottom:calc(var(--sab) + 22px)}
.sheet-b .lbl,.lbl{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 6px;display:block}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.srcrow{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:8px 16px}
.srcrow .ic{color:var(--accent)}
.srcrow span{font-weight:650;font-size:17px}
.field{width:100%;min-height:52px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);font-size:18px;outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field.err{border-color:var(--near)}
.help{font-size:14px;color:var(--ink-3);margin-top:6px}

/* ---------- overlays (test / import / summary / intro) ---------- */
.ovl{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;animation:fade .15s ease}
.ovl-top{flex:none;display:flex;align-items:center;gap:12px;min-height:56px;padding-top:4px}
.ovl-top h2{flex:1;text-align:center;font-size:17px;font-weight:700}
.ovl-top .sl,.ovl-top .sr{min-width:84px;display:flex}
.ovl-top .sr{justify-content:flex-end}
.ovl-top .tbtn{color:var(--accent);font-weight:650;min-height:44px;display:inline-flex;align-items:center;gap:4px}
.ovl-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-top:8px;padding-bottom:20px}
.ovl-body>.col{max-width:640px;margin:0 auto}
.ovl-foot{flex:none;padding-top:10px;padding-bottom:calc(var(--sab) + 14px);background:linear-gradient(to top,var(--bg) 82%,transparent)}
.ovl-foot>.col{max-width:640px;margin:0 auto}
.col{width:100%}

/* test */
.t-top{flex:none;display:flex;align-items:center;gap:14px;min-height:56px}
.t-quit{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font-weight:650;min-height:44px;padding-right:6px}
.t-quit .ic{width:20px;height:20px}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.pcount{font-weight:700;font-size:14px;color:var(--ink-2);min-width:42px;text-align:right}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.meta .dirl{font-size:12.5px;font-weight:750;letter-spacing:.07em;color:var(--ink-3);text-transform:uppercase}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px 20px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:120px;box-shadow:var(--shadow)}
.qword{font-size:40px;font-weight:800;letter-spacing:-.025em;line-height:1.12;overflow-wrap:anywhere}
.qword.long{font-size:30px}
.qcard.small{min-height:0;padding:12px 16px;border-radius:18px;box-shadow:none}
.qcard.small .qword{font-size:24px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 16px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-size:18px;font-weight:600;width:100%;transition:border-color .12s,background-color .12s}
.opt .mk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mk{border-color:var(--accent);background:var(--accent)}
.opt.sel .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-ink)}
.opt .ot{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .tg{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.opt.good{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.good .mk{border:0;background:none;color:var(--ok)}
.opt.picked{border-color:var(--again);border-style:dashed}
.opt.dim{opacity:.55}
.opt .ic{width:24px;height:24px}
.t-foot{flex:none;padding-top:10px;padding-bottom:calc(var(--sab) + 12px);background:var(--bg);border-top:1px solid var(--line)}
.t-foot>.col{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.t-foot .help{margin:0;text-align:center}

function norm(s){return String(s).normalize('NFC').trim().replace(/\s+/g,' ')}
function strip(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'')}
function osa(a,b){
 var n=a.length,m=b.length,d=[],i,j;
 for(i=0;i<=n;i++){d[i]=[];for(j=0;j<=m;j++)d[i][j]=0}
 for(i=0;i<=n;i++)d[i][0]=i;for(j=0;j<=m;j++)d[0][j]=j;
 for(i=1;i<=n;i++)for(j=1;j<=m;j++){
  var c=a[i-1]===b[j-1]?0:1;
  d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
  if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
 }
 return d[n][m];
}
function kindOf(a,t){
 if(a.length<t.length)return 'missing';
 if(a.length>t.length)return 'extra';
 for(var i=0;i<a.length-1;i++){if(a[i]!==t[i]){return (a[i]===t[i+1]&&a[i+1]===t[i])?'swap':'subst'}}
 return 'subst';
}
function judgeOne(a,t,o){
 var al=a.toLowerCase(),tl=t.toLowerCase();
 if(a===t)return {k:'ok'};
 if(al===tl)return o.noun?{k:'near',r:'cap'}:{k:'ok'};
 if(tl.indexOf('ß')>-1&&al.replace(/ss/g,'ß')===tl)return {k:'near',r:'ss'};
 if(strip(al)===strip(tl)){
  if(o.lang==='de'){var ch='ü';for(var i=0;i<tl.length;i++){if(/[äöü]/.test(tl[i])&&al[i]!==tl[i]){ch=tl[i];break}}return {k:'near',r:'umlaut',ch:ch}}
  return {k:'near',r:'dia'};
 }
 if(tl.length>=4&&osa(al,tl)===1)return {k:'near',r:kindOf(al,tl)};
 return {k:'wrong'};
}
function judgeMany(raw,targets,o){
 var best=null,rank={ok:0,near:1,wrong:2};
 targets.forEach(function(t){var r=judgeOne(raw,t,o);r.t=t;if(!best||rank[r.k]<rank[best.k])best=r});
 if(best.k==='wrong')best.t=targets[0];
 return best;
}
function judgeAnswer(input,w,dir,chosenArt){
 var raw=norm(input);
 if(dir==='fc')return judgeMany(raw,w.cz,{lang:'cs'});
 if(w.art){
  var m=raw.match(/^(der|die|das)\s+(.+)$/i),art=m?m[1].toLowerCase():null,noun=m?m[2]:raw;
  if(chosenArt){art=chosenArt;noun=raw.replace(/^(der|die|das)\s+/i,'')}
  var r=judgeOne(noun,w.f,{lang:'de',noun:true});
  if(r.k==='wrong')return {k:'wrong',t:fd(w)};
  if(!art)return {k:'needArt',noun:noun};
  var typed=art+' '+noun;
  if(art!==w.art)return {k:'near',r:'article',t:fd(w),typed:typed,wrongArt:art};
  r.t=fd(w);r.typed=typed;return r;
 }
 return judgeMany(raw,accepts(w),{lang:w.lang});
}
function diffMark(a,b){
 var A=Array.from(a),B=Array.from(b),al=A.map(function(c){return c.toLowerCase()}),bl=B.map(function(c){return c.toLowerCase()});
 var n=A.length,m=B.length,L=[],i,j;
 for(i=0;i<=n;i++){L[i]=[];for(j=0;j<=m;j++)L[i][j]=0}
 for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)L[i][j]=al[i]===bl[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 var ma=A.map(function(){return false}),mb=B.map(function(){return false});i=0;j=0;
 while(i<n&&j<m){if(al[i]===bl[j]){ma[i]=true;mb[j]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
 function wrap(arr,ok){var out='',open=false;arr.forEach(function(c,k){var bad=!ok[k];if(bad&&!open){out+='<u class="d">';open=true}if(!bad&&open){out+='</u>';open=false}out+=esc(c)});if(open)out+='</u>';return out}
 return [wrap(A,ma),wrap(B,mb)];
}

function buildOpts(w,dir){
 var key=function(x){return dir==='fc'?x.cz[0]:fd(x)};
 var pool=S.words.filter(function(x){return x.id!==w.id&&x.lang===w.lang&&x.cz.indexOf(w.cz[0])<0});
 var same=shuffle(pool.filter(function(x){return x.pos===w.pos})),rest=shuffle(pool.filter(function(x){return x.pos!==w.pos}));
 var seen={};seen[key(w)]=1;var d=[];
 same.concat(rest).forEach(function(x){var k=key(x);if(d.length<3&&!seen[k]){seen[k]=1;d.push({text:k,ok:false})}});
 return shuffle(d.concat([{text:key(w),ok:true}]));
}
